name: HomeCal verification
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: homecal-verification-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install isolated browser QA tools
        run: npm install --no-save --package-lock=false esbuild playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/visual-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homecal-visual-review
          include-hidden-files: true
          path: .visual/*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homecal-visual-report
          include-hidden-files: true
          path: .visual/report.json
